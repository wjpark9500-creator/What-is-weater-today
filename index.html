<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>오늘, 창문 열까?</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#6b7a5e" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="환기가이드" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body data-level="loading">

  <main class="stage">
    <header class="topbar">
      <span class="eyebrow">환기 가이드</span>
      <button id="locateBtn" class="ghost-btn" title="위치 다시 가져오기">⟳</button>
    </header>

    <div class="mode-tabs" role="tablist">
      <button class="mode-tab active" id="tabNow" data-mode="now">지금</button>
      <button class="mode-tab" id="tabDay" data-mode="day">오늘 하루</button>
    </div>

    <div class="away-settings" id="awaySettings" hidden>
      <span class="away-label">🏠 집 비우는 시간</span>
      <div class="away-inputs">
        <input type="time" id="awayStart" value="08:00" />
        <span>~</span>
        <input type="time" id="awayEnd" value="19:00" />
        <button id="awaySaveBtn" class="away-save-btn">저장</button>
      </div>
    </div>

    <section class="hero">
      <div class="window-wrap" aria-hidden="true">
        <svg id="windowSvg" viewBox="0 0 240 240" class="window">
          <defs>
            <clipPath id="sceneClip">
              <rect x="24" y="24" width="192" height="192" rx="4" />
            </clipPath>
          </defs>

          <rect x="10" y="10" width="220" height="220" rx="10" class="frame-outer" />
          <rect x="24" y="24" width="192" height="192" rx="4" class="frame-inner" />

          <g clip-path="url(#sceneClip)">
            <rect class="scene-sky" x="24" y="24" width="192" height="192" />

            <g class="scene-clouds">
              <g class="cloud cloud-1">
                <ellipse cx="50" cy="55" rx="18" ry="9" />
                <ellipse cx="65" cy="50" rx="14" ry="8" />
                <ellipse cx="35" cy="52" rx="12" ry="7" />
              </g>
              <g class="cloud cloud-2">
                <ellipse cx="150" cy="95" rx="20" ry="10" />
                <ellipse cx="168" cy="90" rx="14" ry="8" />
                <ellipse cx="132" cy="93" rx="12" ry="7" />
              </g>
              <g class="cloud cloud-3">
                <ellipse cx="90" cy="150" rx="16" ry="8" />
                <ellipse cx="105" cy="146" rx="12" ry="7" />
                <ellipse cx="75" cy="148" rx="10" ry="6" />
              </g>
            </g>

            <g class="scene-sun">
              <g class="sun-rays">
                <line x1="178" y1="30" x2="178" y2="42" />
                <line x1="140" y1="45" x2="149" y2="52" />
                <line x1="216" y1="45" x2="207" y2="52" />
                <line x1="130" y1="68" x2="142" y2="68" />
                <line x1="226" y1="68" x2="214" y2="68" />
              </g>
              <circle class="sun-body" cx="178" cy="68" r="18" />
            </g>

            <g class="scene-bird">
              <ellipse cx="165" cy="203" rx="7" ry="5" class="bird-body" />
              <circle cx="171" cy="199" r="3" class="bird-body" />
              <polygon points="173,199 178,200 173,201.5" class="bird-beak" />
              <path d="M159,203 q-5,-2 -8,1" class="bird-tail" />
            </g>

            <g transform="translate(14,70) scale(0.52)">
              <g class="easter-girl">
                <path d="M70,90 Q50,100 54,130 Q56,145 68,148" class="girl-braid" />
                <path d="M130,90 Q150,100 146,130 Q144,145 132,148" class="girl-braid" />
                <circle cx="68" cy="148" r="6" class="girl-ribbon" />
                <circle cx="132" cy="148" r="6" class="girl-ribbon" />
                <path d="M90,175 L82,210" class="girl-leg" />
                <path d="M110,175 L120,210" class="girl-leg" />
                <ellipse cx="80" cy="213" rx="9" ry="5" class="girl-shoe" />
                <ellipse cx="122" cy="213" rx="9" ry="5" class="girl-shoe" />
                <path d="M78,120 Q100,108 122,120 L132,178 Q100,192 68,178 Z" class="girl-dress" />
                <path d="M78,120 Q100,128 122,120" class="girl-dress-trim" />
                <path d="M80,128 Q56,118 48,96" class="girl-arm" />
                <path d="M120,128 Q144,118 152,96" class="girl-arm" />
                <circle cx="47" cy="94" r="6" class="girl-skin" />
                <circle cx="153" cy="94" r="6" class="girl-skin" />
                <rect x="93" y="105" width="14" height="12" class="girl-skin" />
                <circle cx="100" cy="80" r="30" class="girl-skin" />
                <path d="M70,78 Q68,45 100,42 Q132,45 130,78 Q128,55 100,55 Q72,55 70,78 Z" class="girl-hair" />
                <path d="M68,75 Q64,95 72,108" class="girl-hair-side" />
                <path d="M132,75 Q136,95 128,108" class="girl-hair-side" />
                <circle cx="88" cy="88" r="1.6" class="girl-freckle" />
                <circle cx="94" cy="91" r="1.6" class="girl-freckle" />
                <circle cx="106" cy="91" r="1.6" class="girl-freckle" />
                <circle cx="112" cy="88" r="1.6" class="girl-freckle" />
                <path d="M82,66 Q88,60 94,65" class="girl-brow" />
                <path d="M106,65 Q112,60 118,66" class="girl-brow" />
                <circle cx="88" cy="76" r="6" class="girl-eye-white" />
                <circle cx="112" cy="76" r="6" class="girl-eye-white" />
                <circle cx="88" cy="77" r="3.4" class="girl-eye-pupil" />
                <circle cx="112" cy="77" r="3.4" class="girl-eye-pupil" />
                <ellipse cx="100" cy="93" rx="5" ry="6.5" class="girl-mouth" />
                <ellipse cx="100" cy="95" rx="3" ry="3.6" class="girl-tongue" />
                <ellipse cx="78" cy="88" rx="5" ry="3" class="girl-blush" />
                <ellipse cx="122" cy="88" rx="5" ry="3" class="girl-blush" />
              </g>
            </g>

            <g transform="translate(130,78) scale(0.46)">
              <g class="easter-snowman">
                <g class="snowman-idle-wrap">
                  <circle cx="100" cy="160" r="42" class="snowman-body" />
                  <circle cx="100" cy="103" r="32" class="snowman-body" />
                  <circle cx="100" cy="58" r="24" class="snowman-body" />
                  <path d="M72,100 Q45,90 30,68" class="snowman-arm" />
                  <path d="M128,100 Q155,90 170,68" class="snowman-arm" />
                  <circle cx="100" cy="113" r="3" class="snowman-face" />
                  <circle cx="100" cy="126" r="3" class="snowman-face" />
                  <path d="M78,74 Q100,88 122,74 L120,84 Q100,96 80,84 Z" class="snowman-scarf" />
                  <path d="M112,82 L120,110 L108,108 Z" class="snowman-scarf-tail" />
                  <circle cx="92" cy="53" r="2.6" class="snowman-face" />
                  <circle cx="108" cy="53" r="2.6" class="snowman-face" />
                  <polygon points="100,58 116,62 100,66" class="snowman-nose" />
                  <circle cx="88" cy="70" r="1.6" class="snowman-smile" />
                  <circle cx="94" cy="73" r="1.6" class="snowman-smile" />
                  <circle cx="101" cy="74" r="1.6" class="snowman-smile" />
                  <rect x="82" y="26" width="36" height="8" rx="2" class="snowman-hat" />
                  <rect x="87" y="8" width="26" height="20" rx="2" class="snowman-hat" />
                  <rect x="87" y="20" width="26" height="5" class="snowman-hat-band" />
                </g>
              </g>
            </g>
          </g>

          <g id="leftPane" class="pane-group">
            <rect x="26" y="26" width="92" height="188" class="pane" />
          </g>
          <g id="rightPane" class="pane-group">
            <rect x="122" y="26" width="92" height="188" class="pane" />
          </g>

          <g class="scene-fog">
            <ellipse class="fog-p" cx="70" cy="75" rx="34" ry="28" />
            <ellipse class="fog-p" cx="152" cy="145" rx="36" ry="30" />
            <ellipse class="fog-p" cx="100" cy="185" rx="28" ry="20" />
          </g>

          <g class="scene-dust">
            <circle class="dust dust-1" cx="20" cy="60" r="3" />
            <circle class="dust dust-2" cx="30" cy="185" r="2.5" />
            <circle class="dust dust-3" cx="212" cy="90" r="3" />
            <circle class="dust dust-4" cx="202" cy="165" r="2" />
            <circle class="dust dust-5" cx="120" cy="16" r="2.5" />
          </g>
        </svg>
        <div class="drip" id="drip"></div>
      </div>

      <h1 id="verdictMessage" class="verdict-message">지금 위치의 날씨를 확인하고 있어요…</h1>
      <p id="verdictSub" class="verdict-sub">잠시만 기다려주세요</p>
    </section>

    <section class="stats" id="stats" hidden>
      <div class="stat">
        <span class="stat-label" id="labelTemp">기온</span>
        <span class="stat-value" id="statTemp">–</span>
      </div>
      <div class="stat">
        <span class="stat-label" id="labelHumid">습도</span>
        <span class="stat-value" id="statHumid">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">
          미세먼지
          <span class="info-icon" tabindex="0" aria-label="미세먼지 등급 기준 안내">
            ?
            <span class="tooltip">
              <strong>PM10 기준 (㎍/㎥)</strong>
              <span>좋음 0~30</span>
              <span>보통 31~80</span>
              <span>나쁨 81~150</span>
              <span>매우나쁨 151~</span>
            </span>
          </span>
        </span>
        <span class="stat-value" id="statPm10">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">
          초미세먼지
          <span class="info-icon" tabindex="0" aria-label="초미세먼지 등급 기준 안내">
            ?
            <span class="tooltip">
              <strong>PM2.5 기준 (㎍/㎥)</strong>
              <span>좋음 0~15</span>
              <span>보통 16~35</span>
              <span>나쁨 36~75</span>
              <span>매우나쁨 76~</span>
            </span>
          </span>
        </span>
        <span class="stat-value" id="statPm25">–</span>
      </div>
    </section>

    <section class="stats" id="dayStats" hidden>
      <div class="stat">
        <span class="stat-label">강수확률</span>
        <span class="stat-value" id="statPop">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">평균풍속</span>
        <span class="stat-value" id="statWind">–</span>
      </div>
      <div class="stat" id="statScoreWrap">
        <span class="stat-label">환기 점수</span>
        <span class="stat-value" id="statScore">–</span>
      </div>
    </section>

    <section class="location-row">
      <span id="locationLabel" class="location-label">위치 확인 중…</span>
    </section>

    <div class="manual-panel">
      <select id="citySelect">
        <option value="">다른 지역 선택</option>
      </select>
    </div>

    <p id="errorBox" class="error-box" hidden></p>
  </main>

  <div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
    <span class="loading-dots big"><span></span><span></span><span></span></span>
  </div>

  <div class="snowstorm-overlay" id="snowstormOverlay" aria-hidden="true"></div>

  <div class="easter-3d-backdrop" aria-hidden="true"></div>
  <canvas id="easter3dCanvas" class="easter-3d-canvas" aria-hidden="true"></canvas>

  <script src="app.js"></script>
</body>
</html>
